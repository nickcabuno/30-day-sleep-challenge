<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#4c3f94" />
<title>Rewards · Get Your Z's</title>
<script>(function(){try{var t=localStorage.getItem('sc-theme')||'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#4c3f94':'#7c6fe6');}catch(e){}})();</script>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="chat-widget.css" />
</head>

<div id="header-root"></div>

    <div class="card-title">Your Achievements</div>
    <p class="muted" style="margin-top:4px;">Earn badges for participation and consistency — not for sleeping more than other students.</p>
    <div class="badge-grid" id="badge-grid" style="margin-top:14px;"></div>
  </div>

  <div class="card">
    <div class="card-title">Friendly Leaderboard</div>
    <div id="leaderboard" style="margin-top:10px;"></div>
  </div>
</div>

<div id="tabbar-root"></div>

</html>

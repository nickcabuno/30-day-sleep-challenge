<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#4c3f94" />
<title>Community · Get Your Z's</title>
<script>(function(){try{var t=localStorage.getItem('sc-theme')||'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#4c3f94':'#7c6fe6');}catch(e){}})();</script>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="chat-widget.css" />
</head>
<body>

<div id="header-root"></div>

<div class="page">
  <div class="card composer">
    <div class="card-title" style="margin-bottom:10px;">Share what works for you</div>
    <textarea id="post-input" placeholder="What's one sleep habit you're working on?"></textarea>
    <button class="btn" id="post-btn" type="button">Post</button>
  </div>

  <div class="card">
    <div id="feed-list"></div>
  </div>
</div>

<div id="tabbar-root"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script src="community.js"></script>
<script src="chat-widget.js"></script>
</body>
</html>

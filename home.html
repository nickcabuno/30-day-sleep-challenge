<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#4c3f94" />
<title>Home · Get Your Z's</title>
<script>(function(){try{var t=localStorage.getItem('sc-theme')||'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#4c3f94':'#7c6fe6');}catch(e){}})();</script>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="chat-widget.css" />
</head>
<body>

<div id="header-root"></div>

<div class="page">
  <div class="card">
    <div class="card-row">
      <div class="card-title">Challenge progress</div>
      <div id="progress-pct" class="muted"></div>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="calendar" id="calendar"></div>
  </div>

  <div class="card mission-card">
    <div class="card-title" id="mission-title">🌱 Today's healthy sleep mission</div>
    <p id="mission-text"></p>
    <button class="btn" id="mission-btn" type="button">Complete today's check-in →</button>
  </div>

  <div class="quick-links">
    <a href="community.html" class="quick-link-card">
      <div class="emoji">💬</div>
      <div class="ql-title">Your community</div>
      <div class="ql-sub">Share what works for you.</div>
      <span class="ql-cta">Join discussion →</span>
    </a>
    <a href="rewards.html" class="quick-link-card">
      <div class="emoji">🏆</div>
      <div class="ql-title">Achievements</div>
      <div class="ql-sub">Celebrate healthy habits.</div>
      <span class="ql-cta">View badges →</span>
    </a>
  </div>
</div>

<!-- Read-only view of a completed day -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <button class="close-x" id="modal-close">&times;</button>
    <h2 id="modal-title">Day</h2>
    <p class="sub" id="modal-sub"></p>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="modal-cancel" type="button">Close</button>
    </div>
  </div>
</div>

<div id="tabbar-root"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script src="home.js"></script>
<script src="chat-widget.js"></script>
</body>
</html>

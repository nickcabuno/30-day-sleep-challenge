<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>30 Day Sleep Challenge</title>
<script>(function(){try{var t=localStorage.getItem('sc-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="auth-wrap">
  <h1>30 Day Sleep Challenge</h1>
  <p class="sub" id="auth-sub">Sign in to check in for today.</p>

  <div class="error-msg" id="auth-error"></div>
  <div class="info-msg" id="auth-info"></div>

  <form id="signin-form">
    <div class="field">
      <label>Email</label>
      <input type="email" id="si-email" required autocomplete="email" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="si-password" required autocomplete="current-password" />
    </div>
    <button class="btn" type="submit">Sign in</button>
  </form>

  <form id="signup-form" style="display:none;">
    <div class="field">
      <label>Username</label>
      <input type="text" id="su-username" required pattern="[a-zA-Z0-9_]{3,20}" placeholder="letters, numbers, underscore" />
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="su-email" required autocomplete="email" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="su-password" required minlength="6" autocomplete="new-password" />
    </div>
    <button class="btn" type="submit">Create account</button>
  </form>

  <div class="switch-mode">
    <span id="to-signup">Don't have an account? <a href="#">Sign up</a></span>
    <span id="to-signin" style="display:none;">Already have an account? <a href="#">Sign in</a></span>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(async function () {
  // Already signed in? Skip straight to the challenge.
  const session = await SC.getSession();
  if (session) {
    window.location.href = 'challenge.html';
    return;
  }

  const errorBox = document.getElementById('auth-error');
  const infoBox = document.getElementById('auth-info');
  const signinForm = document.getElementById('signin-form');
  const signupForm = document.getElementById('signup-form');
  const sub = document.getElementById('auth-sub');

  function showError(msg) {
    infoBox.classList.remove('show');
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function showInfo(msg) {
    errorBox.classList.remove('show');
    infoBox.textContent = msg;
    infoBox.classList.add('show');
  }
  function clearMsgs() {
    errorBox.classList.remove('show');
    infoBox.classList.remove('show');
  }

  document.getElementById('to-signup').addEventListener('click', (e) => {
    e.preventDefault();
    signinForm.style.display = 'none';
    signupForm.style.display = 'block';
    document.getElementById('to-signup').style.display = 'none';
    document.getElementById('to-signin').style.display = 'block';
    sub.textContent = 'Create an account to join the challenge.';
    clearMsgs();
  });
  document.getElementById('to-signin').addEventListener('click', (e) => {
    e.preventDefault();
    signupForm.style.display = 'none';
    signinForm.style.display = 'block';
    document.getElementById('to-signin').style.display = 'none';
    document.getElementById('to-signup').style.display = 'block';
    sub.textContent = 'Sign in to check in for today.';
    clearMsgs();
  });

  signinForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsgs();
    const btn = signinForm.querySelector('button');
    btn.disabled = true;
    try {
      await SC.signIn(
        document.getElementById('si-email').value.trim(),
        document.getElementById('si-password').value
      );
      window.location.href = 'challenge.html';
    } catch (err) {
      showError(err.message || 'Could not sign in.');
      btn.disabled = false;
    }
  });

  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsgs();
    const btn = signupForm.querySelector('button');
    btn.disabled = true;
    try {
      const data = await SC.signUp(
        document.getElementById('su-email').value.trim(),
        document.getElementById('su-password').value,
        document.getElementById('su-username').value
      );
      if (data.session) {
        window.location.href = 'challenge.html';
      } else {
        showInfo('Account created! Check your email to confirm, then sign in.');
        signupForm.reset();
      }
    } catch (err) {
      showError(err.message || 'Could not create account.');
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
